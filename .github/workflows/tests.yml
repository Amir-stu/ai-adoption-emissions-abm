name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the test suite
        run: pytest -q

      - name: Check that Table 4.1 regenerates
        # The analytic table is closed form and runs in a second, so it is
        # regenerated on every push and compared against the committed file.
        run: |
          cp results/table4_1_threshold.csv /tmp/table4_1_committed.csv
          cd src && python threshold.py
          cd .. && diff -q /tmp/table4_1_committed.csv results/table4_1_threshold.csv
